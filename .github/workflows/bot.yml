name: date-ideas-bot

on:
  schedule:
    # GitHub cron is in UTC. Singapore is UTC+8. Runs can start a few minutes (sometimes ~1h) late.
    - cron: "0 11 25 * *"   # monthly lineup: 25th, 7pm SGT
    - cron: "0 11 * * 1"    # weekly update: Monday, 7pm SGT
    - cron: "0 1 * * *"     # daily: reactions + ticket alerts, 9am SGT
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [daily, weekly, monthly]
        default: daily
      dry_run:
        description: Print messages in the log instead of posting (DB changes are not saved)
        type: boolean
        default: true
      month:
        description: "monthly only: post the lineup for this month (YYYY-MM). Blank = next month."
        type: string
        required: false

# Never run two jobs at once: they share the SQLite file.
concurrency:
  group: date-ideas-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick job
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.job }}
          INPUT_DRY: ${{ inputs.dry_run }}
          INPUT_MONTH: ${{ inputs.month }}
        run: |
          case "$SCHEDULE" in
            "0 11 25 * *") JOB=monthly ;;
            "0 11 * * 1")  JOB=weekly ;;
            "0 1 * * *")   JOB=daily ;;
            *)             JOB="$INPUT_JOB" ;;
          esac
          ARGS="$JOB"
          if [ "$INPUT_DRY" = "true" ]; then ARGS="$ARGS --dry-run"; echo "dry=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$JOB" = "monthly" ] && [ -n "$INPUT_MONTH" ]; then ARGS="$ARGS --month $INPUT_MONTH"; fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "Running: python -m bot $ARGS"

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m bot ${{ steps.pick.outputs.args }}

      # Save the database even if the run failed halfway, so posted events are never re-posted.
      - name: Save database
        if: always() && steps.pick.outputs.dry != 'true'
        run: |
          [ -f data/bot.db ] || { echo "No DB yet"; exit 0; }
          git config user.name "date-ideas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot.db
          if git diff --cached --quiet; then echo "No DB changes"; exit 0; fi
          git commit -m "chore: update bot database [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
